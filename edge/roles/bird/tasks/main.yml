---
- name: Paquet bird2
  ansible.builtin.apt:
    lock_timeout: 600   # apt peut être tenu par unattended-upgrades sur une machine fraîche
    name: bird2
    state: present

- name: bird.conf
  ansible.builtin.template:
    src: bird.conf.j2
    dest: /etc/bird/bird.conf
    owner: bird
    group: bird
    mode: "0640"
    validate: "bird -p -c %s"
  notify: reload bird
  when: flyc_bgp.enabled | default(true)

- name: BIRD actif
  ansible.builtin.service:
    name: bird
    state: started
    enabled: true
  when: flyc_bgp.enabled | default(true)

- name: BIRD arrêté (BGP désactivé dans l'inventaire)
  ansible.builtin.service:
    name: bird
    state: stopped
    enabled: false
  when: not (flyc_bgp.enabled | default(true))
