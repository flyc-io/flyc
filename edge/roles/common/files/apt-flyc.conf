// Écrit par Ansible (rôle common) : ne pas modifier à la main.
//
// Sans ces réglages, une connexion perdue vers un miroir bloque apt indéfiniment : on a vu des
// « apt-get update » figés plus de dix heures, qui font échouer un déploiement par ailleurs sain.
// Le réseau de sortie perd environ une requête sur cinq vers les miroirs Ubuntu ; apt doit
// abandonner vite et réessayer plutôt que d'attendre.
Acquire::Retries "3";
Acquire::http::Timeout "20";
Acquire::https::Timeout "20";
Acquire::ftp::Timeout "20";
Acquire::Languages "none";
