---
# Génère une seule fois les secrets partagés sur l'hôte data, puis les expose
# aux autres hôtes via hostvars[groups['data'][0]].flyc_secrets.
- name: Secrets existants ?
  ansible.builtin.stat:
    path: "{{ flyc_install_dir }}/secrets.env"
  register: secrets_stat

- name: Génération des secrets (premier run)
  ansible.builtin.shell: |
    set -e
    umask 077
    {
      echo "DATAPLANE_PASSWORD=$(openssl rand -hex 24)"
      echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
      echo "INTERNAL_TOKEN=$(openssl rand -hex 32)"
      echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
      echo "FLYC_MASTER_KEY=$(openssl rand -base64 32)"
      echo "GRAFANA_PASSWORD=$(openssl rand -hex 12)"
    } > {{ flyc_install_dir }}/secrets.env
    chown root:flyc {{ flyc_install_dir }}/secrets.env
    chmod 0640 {{ flyc_install_dir }}/secrets.env
  args:
    creates: "{{ flyc_install_dir }}/secrets.env"
  when: not secrets_stat.stat.exists

- name: Secret Grafana ajouté aux installations antérieures
  ansible.builtin.shell: grep -q '^GRAFANA_PASSWORD=' {{ flyc_install_dir }}/secrets.env || echo "GRAFANA_PASSWORD=$(openssl rand -hex 12)" >> {{ flyc_install_dir }}/secrets.env
  changed_when: false

# Clé de déploiement : control s'en sert pour joindre les nœuds en SSH. La privée est générée
# ici, sur l'hôte control, et n'en sort jamais ; seule la publique est posée sur les machines.
# Elle vit dans un fichier et non en base : une sauvegarde de la base ne doit pas l'emporter.
- name: Répertoire de la clé de déploiement
  ansible.builtin.file:
    path: "{{ flyc_data_dir }}/deploy"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Clé de déploiement (générée une fois)
  ansible.builtin.command:
    cmd: ssh-keygen -t ed25519 -N '' -C "flyc-deploy@{{ flyc_control_host }}" -f {{ flyc_data_dir }}/deploy/id_ed25519
    creates: "{{ flyc_data_dir }}/deploy/id_ed25519"

- name: Lecture de la clé publique de déploiement
  ansible.builtin.slurp:
    src: "{{ flyc_data_dir }}/deploy/id_ed25519.pub"
  register: deploy_pub_raw

- name: Clé publique en variable de host
  ansible.builtin.set_fact:
    flyc_deploy_pubkey: "{{ deploy_pub_raw.content | b64decode | trim }}"

- name: Lecture des secrets
  ansible.builtin.slurp:
    src: "{{ flyc_install_dir }}/secrets.env"
  register: secrets_raw
  no_log: true

- name: Secrets en variable de host (surcharge possible par inventory/secrets.yml)
  ansible.builtin.set_fact:
    flyc_secrets: "{{ secrets_generated | combine(flyc_secrets_override | default({})) }}"
  vars:
    secrets_generated: "{{ dict(secrets_raw.content | b64decode | trim | split('\n') | map('split', '=', 1) | list) }}"
  no_log: true
