[defaults]
# Inventaire par défaut : votre fichier, créé par tools/setup.sh et non versionné (voir
# inventory/example-*.yml). L'installation normale passe par tools/install-control.sh et
# l'interface, qui n'emploient pas ce chemin.
inventory = inventory/test.yml
roles_path = edge/roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
# Les faits sont collectés une fois par hôte et réutilisés par les plays suivants du même run
# (quatre plays passent sur les mêmes machines).
gathering = smart
callback_result_format = yaml
forks = 10
timeout = 30

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
