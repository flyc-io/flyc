# Nœud Redis Cluster Flyc. Port, mot de passe et IP annoncée sont passés en ligne de commande.
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000
cluster-require-full-coverage no
appendonly yes
appendfsync everysec
save ""
maxmemory-policy noeviction
tcp-keepalive 60
protected-mode no
bind 0.0.0.0
dir /data
